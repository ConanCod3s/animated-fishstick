name: AquaGuard CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm --prefix Frontend ci
          npm --prefix Backend-JavaScript ci
          npm --prefix AI-Worker ci

      - name: Run tests/lint
        run: |
          npm --prefix Frontend test
          npm --prefix Backend-JavaScript test
          npm --prefix AI-Worker test
          npm --prefix Frontend run lint

      - name: Build frontend
        run: npm --prefix Frontend run build

      - name: Validate Worker bundle
        run: npm --prefix AI-Worker run check
